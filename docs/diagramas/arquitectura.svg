<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 656" width="760" height="656" role="img" aria-label="Cada partida llega como evento a la API y alimenta el dashboard" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <title>Cada partida llega como evento a la API y alimenta el dashboard</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9A9A92"/>
    </marker>
  </defs>
  <rect width="760" height="656" fill="#FFFFFF"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1F1F1E">Cada partida llega como evento a la API y alimenta el dashboard</text>

  <!-- Nodo: navegador -->
  <rect x="24" y="60" width="712" height="116" rx="8" fill="#F1F1EE" stroke="#9A9A92" stroke-width="1.25"/>
  <text x="40" y="82" font-weight="600" fill="#1F1F1E">Navegador web · PC, tablet o celular</text>
  <text x="720" y="82" text-anchor="end" font-size="11.5" fill="#6B6B66">«dispositivo»</text>
  <g text-anchor="middle">
    <rect x="40" y="100" width="216" height="56" rx="8" fill="none" stroke="#9A9A92" stroke-width="1.25"/>
    <text x="148" y="124" font-weight="600" fill="#1F1F1E">SPA React</text>
    <text x="148" y="140" font-size="11.5" fill="#6B6B66">rutas, lecciones, perfil</text>
    <rect x="272" y="100" width="216" height="56" rx="8" fill="none" stroke="#9A9A92" stroke-width="1.25"/>
    <text x="380" y="124" font-weight="600" fill="#1F1F1E">Motor de juegos</text>
    <text x="380" y="140" font-size="11.5" fill="#6B6B66">plantillas J01–J10</text>
    <rect x="504" y="100" width="216" height="56" rx="8" fill="none" stroke="#9A9A92" stroke-width="1.25"/>
    <text x="612" y="124" font-weight="600" fill="#1F1F1E">Dashboard docente</text>
    <text x="612" y="140" font-size="11.5" fill="#6B6B66">gráficas y filtros</text>
  </g>

  <!-- Nodo: API -->
  <rect x="24" y="216" width="712" height="184" rx="8" fill="#F1F1EE" stroke="#9A9A92" stroke-width="1.25"/>
  <text x="40" y="238" font-weight="600" fill="#1F1F1E">API · Node.js en contenedor Docker</text>
  <text x="720" y="238" text-anchor="end" font-size="11.5" fill="#6B6B66">«servidor»</text>
  <g text-anchor="middle">
    <rect x="40" y="256" width="216" height="56" rx="8" fill="none" stroke="#9A9A92" stroke-width="1.25"/>
    <text x="148" y="280" font-weight="600" fill="#1F1F1E">Autenticación</text>
    <text x="148" y="296" font-size="11.5" fill="#6B6B66">JWT, roles, consentimiento</text>
    <rect x="272" y="256" width="216" height="56" rx="8" fill="none" stroke="#9A9A92" stroke-width="1.25"/>
    <text x="380" y="280" font-weight="600" fill="#1F1F1E">Usuarios y familias</text>
    <text x="380" y="296" font-size="11.5" fill="#6B6B66">grupos, códigos, vínculos</text>
    <rect x="504" y="256" width="216" height="56" rx="8" fill="none" stroke="#9A9A92" stroke-width="1.25"/>
    <text x="612" y="280" font-weight="600" fill="#1F1F1E">Contenido</text>
    <text x="612" y="296" font-size="11.5" fill="#6B6B66">rutas, módulos, juegos</text>
    <rect x="40" y="328" width="216" height="56" rx="8" fill="none" stroke="#9A9A92" stroke-width="1.25"/>
    <text x="148" y="352" font-weight="600" fill="#1F1F1E">Puntaje y gamificación</text>
    <text x="148" y="368" font-size="11.5" fill="#6B6B66">puntos, insignias, rachas</text>
    <rect x="272" y="328" width="216" height="56" rx="8" fill="#DCE7F5" stroke="#2F6FD0" stroke-width="2"/>
    <text x="380" y="352" font-weight="600" fill="#1F1F1E">Eventos y analítica</text>
    <text x="380" y="368" font-size="11.5" fill="#1F1F1E">partidas, métricas, alertas</text>
    <rect x="504" y="328" width="216" height="56" rx="8" fill="none" stroke="#9A9A92" stroke-width="1.25"/>
    <text x="612" y="352" font-weight="600" fill="#1F1F1E">Reportes</text>
    <text x="612" y="368" font-size="11.5" fill="#6B6B66">CSV, PDF, resumen semanal</text>
  </g>

  <!-- Nodos de datos y tareas -->
  <g text-anchor="middle">
    <rect x="24" y="440" width="216" height="72" rx="8" fill="#F1F1EE" stroke="#9A9A92" stroke-width="1.25"/>
    <text x="132" y="464" font-weight="600" fill="#1F1F1E">Base de datos</text>
    <text x="132" y="480" font-size="11.5" fill="#6B6B66">PostgreSQL</text>
    <text x="132" y="496" font-size="11.5" fill="#6B6B66">políticas por fila (RLS)</text>
    <rect x="272" y="440" width="216" height="72" rx="8" fill="#F1F1EE" stroke="#9A9A92" stroke-width="1.25"/>
    <text x="380" y="464" font-weight="600" fill="#1F1F1E">Almacenamiento</text>
    <text x="380" y="480" font-size="11.5" fill="#6B6B66">imágenes, videos, PDF</text>
    <text x="380" y="496" font-size="11.5" fill="#6B6B66">certificados</text>
    <rect x="520" y="440" width="216" height="72" rx="8" fill="#F1F1EE" stroke="#9A9A92" stroke-width="1.25"/>
    <text x="628" y="464" font-weight="600" fill="#1F1F1E">Worker planificador</text>
    <text x="628" y="480" font-size="11.5" fill="#6B6B66">métricas cada hora</text>
    <text x="628" y="496" font-size="11.5" fill="#6B6B66">cola de correos</text>
    <rect x="520" y="576" width="216" height="56" rx="8" fill="#F1F1EE" stroke="#9A9A92" stroke-width="1.25"/>
    <text x="628" y="600" font-weight="600" fill="#1F1F1E">Servicio de correo</text>
    <text x="628" y="616" font-size="11.5" fill="#6B6B66">externo · SMTP o API</text>
  </g>

  <!-- Conectores -->
  <g fill="none" stroke="#9A9A92" stroke-width="1.25">
    <path d="M380 176V216" marker-end="url(#arrow)"/>
    <path d="M132 400V440" marker-end="url(#arrow)"/>
    <path d="M380 400V440" marker-end="url(#arrow)"/>
    <path d="M560 512V536H132V512" marker-end="url(#arrow)"/>
    <path d="M680 512V576" marker-end="url(#arrow)"/>
  </g>
  <g font-size="11.5" fill="#6B6B66">
    <text x="392" y="200">HTTPS · REST / JSON</text>
    <text x="144" y="424">SQL</text>
    <text x="392" y="424">HTTPS · URLs firmadas</text>
    <text x="346" y="554" text-anchor="middle">lee eventos, escribe métricas</text>
    <text x="692" y="548">SMTP</text>
  </g>
</svg>
